name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target: linux-x64
          - goos: linux
            goarch: arm64
            target: linux-arm64
          - goos: darwin
            goarch: amd64
            target: darwin-x64
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
          - goos: windows
            goarch: amd64
            target: win32-x64
          - goos: windows
            goarch: arm64
            target: win32-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o "urscript-ls-${{ matrix.target }}${EXT}" \
            ./cmd/urscript-ls

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: urscript-ls-*

  github-release:
    name: GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  publish-extension:
    name: Publish Extension
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate marketplace credentials
        run: |
          missing=0

          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing required repository secret VSCE_PAT"
            missing=1
          fi

          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Missing required repository secret OVSX_PAT"
            missing=1
          fi

          exit "$missing"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: binaries/

      - name: Install extension dependencies
        working-directory: editors/code
        run: npm ci

      - name: Set extension version from tag
        working-directory: editors/code
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Package platform-specific extensions
        working-directory: editors/code
        run: |
          TARGETS="linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64"
          for target in $TARGETS; do
            mkdir -p server

            # Determine the binary name in the artifacts
            if echo "$target" | grep -q "win32"; then
              cp "../../binaries/urscript-ls-${target}.exe" server/urscript-ls.exe
            else
              cp "../../binaries/urscript-ls-${target}" server/urscript-ls
              chmod +x server/urscript-ls
            fi

            npx vsce package --target "$target" -o "urscript-${target}.vsix"
            rm -rf server
          done

      - name: Publish to VS Code Marketplace
        working-directory: editors/code
        run: npx vsce publish --packagePath *.vsix

      - name: Publish to Open VSX
        working-directory: editors/code
        run: |
          for vsix in *.vsix; do
            npx ovsx publish "$vsix" -p "$OVSX_PAT"
          done
